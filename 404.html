<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>تَوْبَة — Tawba</title>
    <script>
      // GitHub Pages SPA redirect — preserves the full path and query string
      // so the React app can handle client-side routing correctly.
      // Technique: encode the path as a query param, then restore it in index.html.
      var segmentCount = 1; // number of path segments in the repo name (/Tawba = 1)
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
      var query = l.search.slice(1);
      var hash = l.hash.slice(1);
      var redirect =
        l.protocol + '//' + l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/' +
        '?p=/' + encodeURIComponent(path) +
        (query ? '&q=' + encodeURIComponent(query) : '') +
        (hash ? '#' + hash : '');
      l.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
