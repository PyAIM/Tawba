<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tawba</title>
  <script>
    // Redirect pyaim.github.io/Tawba to tawba.org
    if (window.location.hostname === 'pyaim.github.io') {
      var path = window.location.pathname.replace('/Tawba', '') || '/';
      window.location.replace('https://tawba.org' + path + window.location.search + window.location.hash);
    } else {
      // GitHub Pages SPA redirect — root domain version (tawba.org)
      (function () {
        var l = window.location;
        if (l.pathname !== '/') {
          var encoded = l.pathname.slice(1).replace(/&/g, '~and~');
          var query = l.search ? l.search.slice(1).replace(/&/g, '~and~') : '';
          var redirect = l.protocol + '//' + l.host + '/?/' + encoded +
            (query ? '&' + query : '') + l.hash;
          window.location.replace(redirect);
        }
      })();
    }
  </script>
</head>
<body></body>
</html>
